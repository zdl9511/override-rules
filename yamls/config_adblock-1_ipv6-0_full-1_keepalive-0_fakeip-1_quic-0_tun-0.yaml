mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
routing-mark: 7894
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
unified-delay: true
tcp-concurrent: true
log-level: info
geodata-loader: standard
external-controller: :9999
disable-keep-alive: true
profile:
  store-selected: true
find-process-mode: strict
proxy-groups:
  - name: 直连
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    proxies:
      - DIRECT
  - name: 自定义直连
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    proxies:
      - 直连
      - 国外
  - name: 国外
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    include-all: true
  - name: AI
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    type: select
    include-all: true
  - name: GLOBAL
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    hidden: true
    proxies:
      - 直连
      - 自定义直连
      - 国外
      - AI
rule-providers:
  CustomDirect:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,423down.com
      - DOMAIN-SUFFIX,951199.xyz
      - DOMAIN-SUFFIX,admin.pandarobot.chat
      - DOMAIN-SUFFIX,chengmo.cc.cd
      - DOMAIN-SUFFIX,codexcn.com
      - DOMAIN-SUFFIX,elysia.h-e.top
      - DOMAIN-SUFFIX,gitee.com
      - DOMAIN-SUFFIX,hybgzs.com
      - DOMAIN-SUFFIX,lianxininc.com
      - DOMAIN-SUFFIX,lydgcloud.com
      - DOMAIN-SUFFIX,mpyit.com
      - DOMAIN-SUFFIX,new.qqwang.net
      - DOMAIN-SUFFIX,new.sharedchat.cc
      - DOMAIN-SUFFIX,oracle.com
      - DOMAIN-SUFFIX,pi.dev
      - DOMAIN-SUFFIX,quanshengscm.com
      - DOMAIN-SUFFIX,workflow.lydgcloud.com
      - IP-CIDR,112.233.242.97/32
      - IP-CIDR,116.204.85.57/32
      - IP-CIDR,120.46.144.218/32
      - IP-CIDR,161.118.206.171/32
      - IP-CIDR,172.16.0.2/32
      - IP-CIDR,43.108.58.112/32
      - PROCESS-NAME,WeChat.exe
      - PROCESS-NAME,Weixin.exe
  ADBlock:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://adrules.top/adrules-mihomo.mrs
    path: ./ruleset/ADBlock.mrs
  AdditionalFilter:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/powerfullz/override-rules@master/ruleset/AdditionalFilter.list
    path: ./ruleset/AdditionalFilter.list
rules:
  - RULE-SET,CustomDirect,自定义直连,no-resolve
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT
  - GEOIP,private,直连,no-resolve
  - RULE-SET,ADBlock,REJECT
  - RULE-SET,AdditionalFilter,REJECT
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,cn,直连
  - GEOIP,cn,直连
  - MATCH,国外
sniffer:
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
    QUIC:
      ports:
        - 443
        - 8443
  override-destination: false
  enable: true
  force-dns-mapping: false
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
